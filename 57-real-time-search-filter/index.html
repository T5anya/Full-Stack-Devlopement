<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real Time User Search</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;

    min-height: 100vh;
}

.container {
    width: 100%;
    padding: 50px 30px;
}

/* Heading */

h1 {
    text-align: center;
    margin-bottom: 25px;
}


/* Search box */

#search {
    display: block;

    width: 400px;
    max-width: 100%;

    margin: 0 auto 40px;

    padding: 15px 20px;

    border: none;
    outline: none;

    border-radius: 30px;

    font-size: 16px;
}


/* Cards container */

.cards {
    display: flex;

    gap: 15px;

    width: 100%;

    overflow-x: auto;

    padding: 10px;

    /* scroll-behavior: smooth; */
}


/* Individual card */

.card {
    position: relative;

    width: 200px;
    min-width: 200px;

    height: 360px;

    flex-shrink: 0;

    overflow: hidden;

    border-radius: 18px;

    background: #222;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}


/* User image */

.card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* Dark gradient */

.card::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 60%;

    background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.9)
    );
}


/* Text */

.content {
    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 20px;

    z-index: 2;
}

.content h2 {
    font-size: 20px;

    margin-bottom: 8px;
}

.content p {
    font-size: 13px;

    line-height: 1.4;

    color: #ddd;
}


/* No result */

#noResult {
    display: none;

    text-align: center;

    margin-top: 40px;

    color: #aaa;
}
    </style>
</head>

<body>

    <main class="container">

        <h1>Users</h1>

        <!-- Search input -->
        <input
            type="text"
            id="search"
            placeholder="Search users..."
        >

        <!-- Cards will be added by JavaScript -->
        <div class="cards" id="cards"></div>

        <!-- Shown when no user is found -->
        <p id="noResult">No users found</p>

    </main>

    <script src="index.js"></script>

</body>
</html>
