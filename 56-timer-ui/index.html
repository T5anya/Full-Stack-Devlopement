<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient( 135deg, #eef2ff, #f8f9ff);
            color: #222;
        }
        .container {
            width: 400px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            
        }
        h2{
            font-size: 40px;
            padding-top:40px;
            padding-bottom: 10px;
        }
        h3{
            font-size: 30px;
            padding-bottom: 30px;
        }
        button{
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: #fff;
        };
        
    </style>
</head>
<body>
    <div class="container">
        <h2>Timer</h2>
        <h3>00:00</h3>
        <button id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>

    </div>
    <script src="index.js"></script>
</body>
</html>
